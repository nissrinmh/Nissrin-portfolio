<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Warm Copper & Gold Metallic Gradient -->
    <linearGradient id="ndCopper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0e2" />
      <stop offset="35%" stop-color="#f8c69f" />
      <stop offset="70%" stop-color="#e28a52" />
      <stop offset="100%" stop-color="#b85d26" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="ndGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e28a52" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fedec5" />
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ndGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e28a52" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#090b0f" stop-opacity="0" />
    </radialGradient>

    <!-- Ring Border Gradient -->
    <linearGradient id="ndBorder" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fce8d5" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#e28a52" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#9a4c1f" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Drop Shadow / Glow Filter -->
    <filter id="ndShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e28a50" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Logo -->
  <circle cx="60" cy="60" r="48" fill="url(#ndGlow)" />

  <!-- Outer Glass Ring / Shield -->
  <circle cx="60" cy="60" r="50" fill="#0d1017" fill-opacity="0.9" stroke="url(#ndBorder)" stroke-width="1.75" filter="url(#ndShadow)" />

  <!-- Inner Subtle Accent Ring -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="#e28a52" stroke-opacity="0.18" stroke-dasharray="3 4" stroke-width="1" />

  <!-- Code Bracket Left: < -->
  <path d="M 23 52 L 16 60 L 23 68" fill="none" stroke="url(#ndGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Code Bracket Right: > -->
  <path d="M 97 52 L 104 60 L 97 68" fill="none" stroke="url(#ndGold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Monogram Letter "N" — Refined Serif Typography -->
  <!-- Left Vertical Stem & Serifs -->
  <path d="M 37 36 L 47 36 M 42 36 L 42 84 M 37 84 L 47 84" 
        fill="none" stroke="url(#ndCopper)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Right Vertical Stem & Serifs -->
  <path d="M 73 36 L 83 36 M 78 36 L 78 84 M 73 84 L 83 84" 
        fill="none" stroke="url(#ndCopper)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal Stroke with Dynamic Taper -->
  <path d="M 42 37 L 78 83" 
        fill="none" stroke="url(#ndCopper)" stroke-width="4" stroke-linecap="round" />

  <!-- Botanical Vine Entwining the Monogram -->
  <!-- Stem gracefully curving from bottom-left through the diagonal to top-right -->
  <path d="M 38 78 C 45 74, 52 68, 56 60 C 60 52, 63 45, 76 43" 
        fill="none" stroke="url(#ndGold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Leaf 1 (Climbing on the left) -->
  <path d="M 48 68 C 47 62, 53 59, 56 62 C 55 68, 50 70, 48 68 Z" 
        fill="url(#ndGold)" opacity="0.95" />

  <!-- Leaf 2 (Sprouting near center diagonal) -->
  <path d="M 58 57 C 64 54, 67 59, 65 63 C 60 63, 58 59, 58 57 Z" 
        fill="url(#ndCopper)" opacity="0.9" />

  <!-- Leaf 3 (Top right flourishing tip) -->
  <path d="M 73 44 C 77 39, 83 40, 84 44 C 80 47, 75 46, 73 44 Z" 
        fill="url(#ndGold)" opacity="0.95" />

  <!-- Sparkle Star at Top Right -->
  <g transform="translate(86, 26)">
    <path d="M 0 -5 Q 0 0 5 0 Q 0 0 0 5 Q 0 0 -5 0 Q 0 0 0 -5 Z" fill="#fff5ea" />
    <circle cx="0" cy="0" r="1.2" fill="#f59e0b" />
  </g>

  <!-- Tiny Twinkle at Bottom Left -->
  <g transform="translate(30, 88)">
    <path d="M 0 -3.5 Q 0 0 3.5 0 Q 0 0 0 3.5 Q 0 0 -3.5 0 Q 0 0 0 -3.5 Z" fill="#f8c69f" opacity="0.85" />
  </g>
</svg>
